# =========================================================================
# Nginx Reverse Proxy Configuration for DirectorBot
# Location: Paste this inside your existing server block:
# server {
#     server_name ai.jecrcuniversity.edu.in;
#     ...
# =========================================================================

location /directorbot/ {
    proxy_pass http://127.0.0.1:5122/;
    proxy_http_version 1.1;

    # WebSocket support for real-time Socket.io and WhatsApp QR pairing
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # Client IP and Host headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Buffer & Timeout settings for streaming and large briefing downloads
    proxy_buffering off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Socket.io WebSocket path fallback
location /directorbot/socket.io/ {
    proxy_pass http://127.0.0.1:5122/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
}
